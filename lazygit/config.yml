# Symlinked to ~/Library/Application Support/lazygit/config.yml (macOS location)
# Catppuccin Mocha, blue accent
gui:
  nerdFontsVersion: "3"
  showBottomLine: false
  theme:
    activeBorderColor:
      - "#89b4fa"
      - bold
    inactiveBorderColor:
      - "#a6adc8"
    optionsTextColor:
      - "#89b4fa"
    selectedLineBgColor:
      - "#313244"
    cherryPickedCommitBgColor:
      - "#45475a"
    cherryPickedCommitFgColor:
      - "#89b4fa"
    unstagedChangesColor:
      - "#f38ba8"
    defaultFgColor:
      - "#cdd6f4"
    searchingActiveBorderColor:
      - "#f9e2af"
  authorColors:
    "*": "#b4befe"

# GitHub from inside lazygit (gh + gh-dash are installed by install.sh)
customCommands:
  - key: "<c-g>"
    context: "global"
    command: "gh dash"
    description: "Open gh-dash (PRs, issues, CI checks)"
    output: terminal
  - key: "<c-a>"
    context: "global"
    command: "gh pr checks --watch"
    description: "Watch CI checks for this branch's PR"
    output: terminal
